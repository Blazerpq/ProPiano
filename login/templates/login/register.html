{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width-device-width,initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie-edge" />
    <link
      href="https://unpkg.com/ionicons@4.2.2/dist/css/ionicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'login/css/register.css'  %}" />
    <title>Signup</title>
  </head>

  <body>
    <div class="container">
      <div >
        <form method="post">
          {% csrf_token %}
          <h1>Создайте аккаунт</h1>
          {{ form.as_p }}
          <button>Зарегистрироваться</button>
        </form>
      </div>
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>Добро пожаловать</h1>
            <p>
              Чтобы оставаться на связи с нами, пожалуйста, войдите, используя свои личные данные
            </p>
            <a href="{% url 'login' %}"><button class="ghost" id="signIn"></button></a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
