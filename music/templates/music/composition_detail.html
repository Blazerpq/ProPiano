{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ composition.title }}</title>
    <link rel="stylesheet" href="{% static 'music/css/music.css' %}">
</head>
<body>

    <div class="composition-container">
        <h1>{{ composition.title }}</h1>
        <p>Автор: {{ composition.composer_name }}</p>
        <p>Жанр: {{ composition.genre }}</p>

        <!-- Видеоурок -->
        {% if composition.video_url %}
            <h2>Обучающее видео</h2>
            <iframe width="100%" height="400px" src="{{ composition.video_url }}" frameborder="0" allowfullscreen></iframe>
        {% endif %}

        <!-- Двигающиеся ноты -->
        <h2>Ноты</h2>
        <canvas id="sheet-music"></canvas>

        <!-- Подключение MIDI-клавиатуры -->
        <h2>Играй вместе с нотами!</h2>
        <div id="midi-status">Ожидание подключения...</div>

        <!-- Виртуальная клавиатура -->
        <div class="virtual-piano">
            <button class="key" data-note="C4">C</button>
            <button class="key" data-note="D4">D</button>
            <button class="key" data-note="E4">E</button>
            <button class="key" data-note="F4">F</button>
            <button class="key" data-note="G4">G</button>
            <button class="key" data-note="A4">A</button>
            <button class="key" data-note="B4">B</button>
        </div>
    </div>

    <script src="{% static 'music/js/midi.js' %}"></script>
    <script src="{% static 'music/js/sheet_music.js' %}"></script>
</body>
</html>
