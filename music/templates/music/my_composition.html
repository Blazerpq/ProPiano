{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ноты (.musicxml) и Сравнение MIDI</title>
  <link rel="stylesheet" href="{% static 'music/css/my_composition.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.7.6/build/opensheetmusicdisplay.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.7/build/Midi.min.js"></script>
</head>
<body>
  <div id="container">
    <h2>Просмотр нот (.musicxml)</h2>

    <div id="controls">
      <input type="file" id="fileInput" accept=".musicxml,.xml">
      <button id="clearBtn">Очистить</button>
      <button id="zoomInBtn">🔍 Увеличить</button>
      <button id="zoomOutBtn">🔎 Уменьшить</button>
      <button id="prevPageBtn">⬅️ Назад</button>
      <button id="nextPageBtn">➡️ Вперёд</button>
    </div>

    <div id="log"></div>
    <div id="sheet"></div>

    <h3>Сравнение MIDI файлов</h3>
    <div id="midi-controls">
        <input type="file" id="midiFile1" accept=".mid,.midi">
        <input type="file" id="midiFile2" accept=".mid,.midi">
        <button id="compareMidiBtn">Сравнить</button>
    
        <div id="summary-box" style="display:none;"></div>
    </div>

  <script src="{% static 'music/js/my_composition2.js' %}"></script>
</body>
</html>
