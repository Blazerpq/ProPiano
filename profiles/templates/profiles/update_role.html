<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменить роль пользователя</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">  <!-- Подключение общего CSS -->
    <link rel="stylesheet" href="{% static 'profile.css' %}"> <!-- Подключение стилей для личных страниц -->
    <link rel="stylesheet" href="{% static 'music.css' %}">   <!-- Подключение стилей для музыкальной части -->
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Главная</a></li>
                <li><a href="{% url 'owner_dashboard' %}">Личный кабинет</a></li>
                <li><a href="{% url 'logout' %}">Выход</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Изменить роль для {{ user.username }}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Обновить</button>
        </form>
    </main>
</body>
</html>
