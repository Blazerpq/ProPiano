{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProPiano</title>
    <link rel="stylesheet" href="{% static 'main/css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
  </head>
  <body>
    <div class="background">
      <img src="{% static 'main/images/pianoback.jpg' %}" alt="back" class="background-img" />
    </div>
    <header>
      <div class="center-container">
        <nav class="nav">
          <ul>
            <li>
              <a href="{% url 'home' %}"
                ><img
                  src="{% static 'main/images/propianologo1-200h.png' %}"
                  alt="logo"
                  class="logo"
              /></a>
            </li>
            <li>
          <a href="{% url 'review' %}"
                ><button class="login-button">
                  Помощь
                </button></a
              >
            </li>
            <li>
              <a href="{% url 'login' %}"
                ><button class="login-button">
                  Вход
                </button></a
              >
            </li>
            <li>

            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="home_card">
      <div class="center-container">
        <div class="home_info">
          <div class="info__container">
            <h1 class="home_name">ProPiano</h1>
            <h2 class="info__title">Играйте любимую музыку</h2>
            <p class="info__text">
              Приветствуем Вас в ProPiano: вашем мелодичном путеводителе в мир
              фортепиано. От начинающих до мастеров — здесь каждый находит ноту
              своего успеха!
            </p>
            <p class="info__text" id="current-date"></p>
            <p class="info__text" id="current-time"></p>
            <a href="{% url 'login' %}">
            <button class="login-button" onclick="redirectToLoginPage()">
              Вход
            </button>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="center-container">
        <div class="footer-container">
          <p class="footer-text">ProPiano</p>
        </div>
      </div>
    </footer>
    <script src="static/main/js/scripts.js"></script>
  </body>
</html>
