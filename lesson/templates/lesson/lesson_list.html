{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProPiano - Уроки</title>
  <link rel="stylesheet" href="{% static 'main/css/reset.css' %}">
  <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'lesson/css/lesson3.css' %}">
   <!-- Добавим отдельный стиль для уроков -->
</head>
<body>
  <!-- Боковое меню -->
  <div class="sidebar">
    <ul>
      <li><a href="{% url 'music' %}">Музыка</a></li>
      <li><a href="#">Поиск</a></li>
      <li><a href="{% url 'lesson' %}">Уроки</a></li> <!-- Ссылка на раздел Уроки -->
      <li><a href="{% url 'profiles' %}">Личный кабинет</a></li>
      <li><a href="{% url 'review' %}">Поддержка</a></li>
      <li>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="sidebar-link">Выход</button>
        </form>
      </li>
    </ul>
  </div>

  <!-- Основной контент -->
  <main class="main-content">
    
    <div class="lessons-header">
      <h1>Все уроки</h1>
  </div>

    <!-- Карточки уроков -->
    <div class="lessons-container">
      {% for lesson in lessons %}
        <div class="lesson-card">
          <h3>{{ lesson.title }}</h3> <!-- Название урока -->
          <p>{{ lesson.short_description }}</p> <!-- Краткое описание урока -->
          <a href="{% url 'lesson_detail' lesson_id=lesson.id %}">Перейти к уроку</a> <!-- Ссылка на страницу урока -->
        </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
